# Build and test the HDR output work on its branch (Brenyd/photocraft fork). The full gate in
# ci.yml needs storytold's shared actions and private font input; this runs the parts that HDR
# touches: the vendored egui-wgpu patch, the engine's colour/prefs tests, the GPU canvas and the
# desktop app, plus clippy on those crates.
name: hdr-check

on:
  push:
    branches: [hdr-display]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: never
      PHOTOCRAFT_NO_PRINT: "1"
      LPDEST: photocraft-no-such-printer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: Lockfile
        run: |
          set -euo pipefail
          if ! cargo metadata --locked --format-version 1 > /dev/null; then
            echo "::warning::Cargo.lock needed an update; the fixed lock is in the job log and the artifact"
            cargo metadata --format-version 1 > /dev/null
            git diff Cargo.lock
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: cargo-lock
          path: Cargo.lock
      - name: Format
        run: cargo fmt --all --check
      - name: Build the app
        run: cargo build -p photocraft
      - name: Tests (patched egui-wgpu)
        run: cargo test -p egui-wgpu --lib
      - name: Tests (engine colour and preferences)
        run: cargo test -p photocraft-engine --lib -- prefs display_color hdr
      - name: Tests (canvas and app)
        run: |
          cargo test -p photocraft-ui-egui --lib -- gpu_canvas prefs_ui monitor_status
          cargo test -p photocraft --bins -- hdr gpu_startup
      - name: Clippy
        run: cargo clippy -p photocraft-engine -p photocraft-ui-egui -p photocraft --all-targets -- -D warnings
      - name: Layers
        run: cargo xtask layers
      - name: Web build still compiles
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check -p photocraft-ui-egui --target wasm32-unknown-unknown
